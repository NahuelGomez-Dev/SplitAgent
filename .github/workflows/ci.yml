name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check splitagent tests scripts
      - name: ruff format --check
        run: ruff format splitagent tests scripts --check
      - name: Secret scan
        run: python scripts/check_secrets.py --all

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Keep the matrix small: full OS x version is 9 jobs for no extra signal.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pywebview needs a GUI toolkit to import on Linux; the desktop tests
      # only touch the bridge and files, so the GTK/Qt deps are not required.
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0
          pip install -e ".[dev]"
      - name: Install (Windows / macOS)
        if: runner.os != 'Linux'
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --maxfail=1
        env:
          # Tests must never reach the network or a real provider.
          SPLITAGENT_HOME: ${{ runner.temp }}/splitagent-ci

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Check the wheel contains the web assets
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          needed = [
              "splitagent/desktop/web/index.html",
              "splitagent/desktop/web/styles.css",
              "splitagent/desktop/web/app.js",
              "splitagent/desktop/web/assets/Inter.ttf",
          ]
          missing = [n for n in needed if n not in names]
          if missing:
              raise SystemExit(f"missing from wheel: {missing}")
          print(f"{wheel}: all web assets present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
